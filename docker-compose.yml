services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: portifolio
      POSTGRES_PASSWORD: portifolio
      POSTGRES_DB: portifolio
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portifolio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
